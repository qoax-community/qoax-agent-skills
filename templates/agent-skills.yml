# Checks the agent skills in .agents/skills. They are copies from
# qoax-community/qoax-agent-skills, and skills-lock.json pins them.
#
# Copy this file to .github/workflows/agent-skills.yml. Pin the action to the
# commit of a release tag, and put the tag in a comment:
#   uses: qoax-community/qoax-agent-skills@<commit> # vX.Y.Z
# Get the commit with: git rev-parse 'vX.Y.Z^{commit}'
name: Agent skills

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    name: Skills match the lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: qoax-community/qoax-agent-skills@v1.0.0

  upstream:
    name: Skills are current
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: qoax-community/qoax-agent-skills@v1.0.0
        with:
          upstream: "true"
