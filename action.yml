name: Check agent skills
description: Check the vendored agent skills in .agents/skills against skills-lock.json, or update them in a pull request. The default check runs offline and needs no token.
inputs:
  source:
    description: Check only lock entries from this source. The check fails when no lock entry has this source. Set it to an empty string to check every entry.
    default: qoax-community/qoax-agent-skills
  allow:
    description: Space-separated folders in .agents/skills that have no lock entry on purpose.
    default: ""
  claude-links:
    description: Also check that .claude/skills/<name> links to ../../.agents/skills/<name>.
    default: "true"
  upstream:
    description: Compare the lock with the main branch of the source repository instead. Needs github.com.
    default: "false"
  other-sources:
    description: >-
      Also check the lock entries of other sources. "report" prints a warning for each
      difference and does not fail. "fail" fails the check. "off" skips them. With
      upstream, the action clones the skill folders of each other GitHub source.
    default: "off"
  update:
    description: >-
      Update the skills of the source to its main branch, and open or refresh one pull
      request on the branch agent-skills/update. Do not combine it with upstream.
    default: "false"
  bump-pin:
    description: >-
      With update, also move the commit pin of this action in .github/workflows to its
      latest release. The token then needs workflows write, so GITHUB_TOKEN cannot do it.
    default: "false"
  token:
    description: >-
      With update, the token for the push and the pull request. A pull request from
      GITHUB_TOKEN starts no workflow run until a person approves it.
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Check agent skills against skills-lock.json
      if: inputs.update != 'true'
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
        ALLOW: ${{ inputs.allow }}
        CLAUDE_LINKS: ${{ inputs.claude-links }}
        UPSTREAM: ${{ inputs.upstream }}
        OTHER_SOURCES: ${{ inputs.other-sources }}
      run: |
        args=()
        [ -n "$SOURCE" ] && args+=(--source "$SOURCE")
        for name in $ALLOW; do args+=(--allow "$name"); done
        [ "$CLAUDE_LINKS" = "true" ] || args+=(--no-claude-links)
        args+=(--other-sources "$OTHER_SOURCES")
        if [ "$UPSTREAM" = "true" ]; then
          if [ -z "$SOURCE" ]; then
            echo "::error::The upstream check needs a source repository."
            exit 1
          fi
          dir="$RUNNER_TEMP/agent-skills-upstream"
          rm -rf "$dir"
          if ! GIT_TERMINAL_PROMPT=0 git clone -q --depth 1 "https://github.com/$SOURCE.git" "$dir"; then
            echo "::error::Cannot clone https://github.com/$SOURCE.git. Set the source input to the source that skills-lock.json records."
            exit 1
          fi
          args+=(--upstream "$dir" --fetch-other)
        fi
        # Without the code block, Markdown joins the lines of the job summary.
        status=0
        echo '```text' >>"$GITHUB_STEP_SUMMARY"
        node "$GITHUB_ACTION_PATH/scripts/check-skills-lock.mjs" --root "$GITHUB_WORKSPACE" "${args[@]}" |
          tee -a "$GITHUB_STEP_SUMMARY" || status=$?
        echo '```' >>"$GITHUB_STEP_SUMMARY"
        exit "$status"

    - name: Update agent skills in a pull request
      if: inputs.update == 'true'
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GH_TOKEN: ${{ inputs.token }}
        SOURCE: ${{ inputs.source }}
        UPSTREAM: ${{ inputs.upstream }}
        BUMP_PIN: ${{ inputs.bump-pin }}
        CHECKS_NEED_APPROVAL: ${{ inputs.token == github.token }}
      run: |
        if [ "$UPSTREAM" = "true" ] || [ -z "$SOURCE" ]; then
          echo "::error::The update needs a source repository and does not work with upstream."
          exit 1
        fi
        args=(--repo "$GITHUB_REPOSITORY" --source "$SOURCE")
        [ "$BUMP_PIN" = "true" ] && args+=(--bump-pin)
        bash "$GITHUB_ACTION_PATH/scripts/update-pr.sh" "${args[@]}"
