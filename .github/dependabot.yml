# The hook submodule and the actions are pinned by commit, so nothing updates
# on its own. Let Dependabot open the bumps.
version: 2
updates:
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # Conventional Commits, because the hook checks Dependabot too.
      prefix: chore
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
