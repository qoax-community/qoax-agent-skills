name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skills:
    name: Skills, upstream pins and plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Check the marketplace, plugins and skills
        run: node scripts/check-repo.mjs
      - name: Build each third-party skill at its pin and compare
        run: node scripts/sync-upstream.mjs verify
      - name: Install the skills with the skills CLI and check the hashes
        run: sh scripts/self-test.sh
        env:
          DISABLE_TELEMETRY: "1"
