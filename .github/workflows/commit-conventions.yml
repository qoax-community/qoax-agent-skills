# Conventional Commits validation, using qoax-community/qoax-githooks.
#
# This calls the composite action directly. The qoax-reusables workflow is in a
# private repository, and a public repository cannot call it.
#
# Keep the pin below in step with the .githooks/shared submodule. Dependabot
# bumps both.
name: Check commit conventions

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

# A pull request may cancel its own earlier run: the next one re-checks the whole range.
# A push may not -- it is checked over the range it pushed, so cancelling would leave
# those commits unchecked by anything.
concurrency:
  group: >-
    commit-conventions-${{ github.event.pull_request.number
      || format('{0}@{1}', github.ref, github.sha) }}
  cancel-in-progress: true

jobs:
  commit-conventions:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The action enumerates a commit range; a shallow clone has none.
          fetch-depth: 0

      - name: Validate commit messages and pull request title
        uses: qoax-community/qoax-githooks@6d36e527ca2a812b3a11af3ec91821c2c07ef964 # v1.0.7
