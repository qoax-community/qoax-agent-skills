# Conventional Commits validation, using qoax-community/qoax-githooks.
#
# The action also compares the tracked copy at .githooks/commit-msg with the
# hook of the release that it pins. The pin is a commit sha, and the comment
# after it names the release. Dependabot moves both, but it updates the
# comment only while the release is its last token. When a bump changes the
# hook, the compare fails and prints the command that syncs the copy.
name: Check commit conventions

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

# A pull request may cancel its own earlier run: the next one re-checks the whole range.
# A push may not -- it is checked over the range it pushed, so cancelling would leave
# those commits unchecked by anything.
concurrency:
  group: >-
    commit-conventions-${{ github.event.pull_request.number
      || format('{0}@{1}', github.ref, github.sha) }}
  cancel-in-progress: true

jobs:
  commit-conventions:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The action enumerates a commit range; a shallow clone has none.
          fetch-depth: 0

      - name: Validate commit messages, the PR title and the hook copy
        uses: qoax-community/qoax-githooks@4abc39a4da0306503a66682044f5fe8d7f929922 # v1.1.0
