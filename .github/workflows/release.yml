name: Release

# Builds the claude.ai zip file of each plugin from a release tag and attaches
# it to the GitHub release. Run it by hand for a tag that has no zip files.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0.0
        required: true

permissions:
  contents: write

jobs:
  zips:
    name: Plugin zip files for claude.ai
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Build the zip files
        run: sh scripts/build-zips.sh "$TAG" dist
      - name: Attach the zip files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip --verify-tag --title "$TAG" \
              --notes "Test a new plugin as a personal claude.ai upload first. Then, in the claude.ai organisation settings, remove the old uploads and upload these zip files."
          fi
