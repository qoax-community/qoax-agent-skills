name: Upstream skills

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # Fails when a third-party skill changed upstream after its pinned commit.
    name: Third-party skills are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - shell: bash
        run: node scripts/sync-upstream.mjs check | tee -a "$GITHUB_STEP_SUMMARY"
