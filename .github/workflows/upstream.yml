name: Upstream skills

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # Fails when a third-party skill changed upstream after its pinned commit.
    # A change of a source with "check": "report" in upstream/sources.json
    # shows in the job summary and does not fail the job.
    name: Third-party skills are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # Without the code block, Markdown joins the lines of the job summary.
      - shell: bash
        run: |
          status=0
          echo '```text' >>"$GITHUB_STEP_SUMMARY"
          node scripts/sync-upstream.mjs check | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >>"$GITHUB_STEP_SUMMARY"
          exit "$status"
