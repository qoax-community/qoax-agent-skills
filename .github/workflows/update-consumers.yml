# Opens or refreshes one skills update pull request in each consumer
# repository, as Dependabot does for a dependency. A consumer is a repository
# where the GitHub App of the skills bot is installed and whose
# skills-lock.json has a skill from this repository. The pull request also
# moves the pin of this action to the latest release.
#
# Two jobs, so that no job has both the skills CLI and a token that can write:
# - prepare: an App token that can only read clones the consumers, then the
#   script revokes it. Then the skills CLI updates each clone, and the job
#   keeps one patch for each consumer.
# - publish: an App token that can write. publish-pr.sh applies each patch to
#   a new clone, checks each path, then pushes and opens the pull request.
#
# workflow_run always runs the workflow file of the default branch. A tag on
# a commit that nobody reviewed thus cannot run its own copy of this file
# with the App key. The README section "Update pull requests" gives the setup.
name: Update consumers

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      repository:
        description: Update only this repository, as OWNER/NAME. Leave it empty for all.
        default: ""
      dry-run:
        description: Make the commits, but push nothing and open no pull request.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: update-consumers
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare the updates of ${{ matrix.owner }}
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: skills-bot
    strategy:
      fail-fast: false
      matrix:
        owner: [qoax-community, angel-penchev]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SKILLS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SKILLS_BOT_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          permission-contents: read
          # The script revokes the token before the skills CLI runs.
          skip-token-revoke: true
      - name: Clone and update each consumer
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ matrix.owner }}
          ONLY: ${{ inputs.repository }}
        run: |
          args=(--owner "$OWNER" --prepare "$RUNNER_TEMP/updates" --revoke)
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          bash scripts/update-consumers.sh "${args[@]}"
      # Also after a failure in one consumer: the others still get their update.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updates-${{ matrix.owner }}
          path: ${{ runner.temp }}/updates
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Open the pull requests of ${{ matrix.owner }}
    needs: prepare
    if: ${{ !cancelled() && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment: skills-bot
    strategy:
      fail-fast: false
      matrix:
        owner: [qoax-community, angel-penchev]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: updates-${{ matrix.owner }}
          path: ${{ runner.temp }}/updates
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SKILLS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SKILLS_BOT_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Open or refresh each pull request
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          OWNER: ${{ matrix.owner }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          args=(--owner "$OWNER" --publish "$RUNNER_TEMP/updates")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          bash scripts/update-consumers.sh "${args[@]}"
